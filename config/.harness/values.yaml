# Harness expressions are ONLY allowed here (not in the templates).
# Harness resolves these first, then renders the templates with Go templating.
name: <+stage.variables.name>
replicas: 2

image: <+artifact.image>
dockercfg: <+artifact.imagePullSecret>

createNamespace: true
namespace: <+infra.namespace>

containerPort: <+serviceVariables.containerPort>

env:
  config:
    PIPELINE_VAR: <+pipeline.variables.pipelineVar>
    STAGE_VAR: <+stage.variables.myStageVar>
  secrets: {}
