# Harness Service entity: points at the K8s manifest folder + values.yaml in the repo
# and defines the primary artifact that <+artifact.image> resolves to.
service:
  name: Go Demo
  identifier: Go_Demo
  orgIdentifier: default
  projectIdentifier: Product_Demos_CIE
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: godemo_manifests
            type: K8sManifest
            spec:
              store:
                type: Github
                spec:
                  connectorRef: BS1223
                  repoName: goHelloWorldServer
                  gitFetchType: Branch
                  branch: main
                  paths:
                    - deploy/templates
              valuesPaths:
                - deploy/values.yaml
              skipResourceVersioning: false
      artifacts:
        primary:
          primaryArtifactRef: godemo
          sources:
            - identifier: godemo
              type: DockerRegistry
              spec:
                connectorRef: account.nofar_dockerhub
                imagePath: bluebbb/godemo
                tag: <+pipeline.sequenceId>
      variables:
        - name: containerPort
          type: String
          value: "8080"
